[package]
name = "sync-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
argon2 = "0.6"
chacha20poly1305 = "0.11"
getrandom = "0.4"
hkdf = "0.13"
sha2 = "0.11"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
base32 = "0.5"
x25519-dalek = { version = "3", features = ["static_secrets"] }
base64 = "0.23"
serde_json = "1"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
