[package]
name = "sync-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
base32 = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
base64 = "0.22"
serde_json = "1"

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
