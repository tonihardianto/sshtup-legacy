[package]
name = "sync-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "sync_server"
path = "src/lib.rs"

[[bin]]
name = "sshtup_sync_server"
path = "src/main.rs"

[dependencies]
sync-core = { path = "../sync-core" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6"
sha2 = "0.11"
base64 = "0.23"
base32 = "0.5"
getrandom = "0.4"

[dev-dependencies]
ureq = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
