[package]
name = "sync-client"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
sync-core = { path = "../sync-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
base64 = "0.23"
getrandom = "0.4"
zeroize = "1"

[dev-dependencies]
sync-server = { path = "../sync-server" }

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
